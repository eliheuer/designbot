[workspace]
members = [
    "designbot",
    "designbot-render",
    "designbot-cli",
]
resolver = "2"

[package]
name = "designbot-examples"
version = "0.1.0"
edition = "2021"

[dependencies]
designbot = { path = "designbot" }
designbot-render = { path = "designbot-render" }

[[example]]
name = "basic_shapes"
path = "examples/basic_shapes.rs"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Eli"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Linebender ecosystem
vello = "0.3"
kurbo = "0.11"
peniko = "0.2"
parley = "0.2"

# Graphics and rendering
wgpu = "22"
image = "0.25"

# Utilities
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }

# Core library shared
designbot = { path = "designbot" }
designbot-render = { path = "designbot-render" }
