[workspace]
members = [
    "designbot",
    "designbot-render",
    "designbot-cli",
]
resolver = "2"

[package]
name = "designbot"
version = "0.1.0"
edition = "2021"

[lib]
name = "designbot"
path = "src/lib.rs"

[dependencies]
designbot-core = { path = "designbot" }
designbot-render = { path = "designbot-render" }
kurbo.workspace = true
norad.workspace = true
image.workspace = true

[[example]]
name = "basic_shapes"
path = "examples/basic_shapes.rs"

[[example]]
name = "basic_text"
path = "examples/basic_text.rs"

[[example]]
name = "text_alignment"
path = "examples/text_alignment.rs"

[[example]]
name = "animation"
path = "examples/animation.rs"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Eli"]
license = "Apache-2.0"

[workspace.dependencies]
# Linebender ecosystem
vello = "0.3"
vello_cpu = "0.0.4"
kurbo = "0.12"
peniko = "0.5"
parley = "0.2"
swash = "0.1"

# AnyRender abstraction
anyrender = "0.6.1"
anyrender_vello_cpu = "0.8.0"

# Color support
color = "0.3"

# Graphics and rendering
wgpu = "22"
image = "0.25"
png = "0.17"

# Font tooling
norad = { version = "0.18", features = ["kurbo"] }

# Utilities
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
regex = "1.11"
indicatif = "0.17"

# Core library shared
designbot-core = { path = "designbot" }
designbot-render = { path = "designbot-render" }

[[example]]
name = "specimen"
path = "examples/specimen.rs"
