[workspace]
members = [
    "designbot",
    "designbot-render",
    "designbot-cli",
]
resolver = "2"

[package]
name = "designbot"
version = "0.1.0"
edition = "2021"

[lib]
name = "designbot"
path = "src/lib.rs"

[dependencies]
designbot-core = { path = "designbot" }
designbot-render = { path = "designbot-render" }

[[example]]
name = "basic_shapes"
path = "examples/basic_shapes.rs"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Eli"]
license = "Apache-2.0"

[workspace.dependencies]
# Linebender ecosystem
vello = "0.3"
vello_cpu = "0.0.4"
kurbo = "0.12"
peniko = "0.5"
parley = "0.2"

# AnyRender abstraction
anyrender = "0.6.1"
anyrender_vello_cpu = "0.8.0"

# Color support
color = "0.3"

# Graphics and rendering
wgpu = "22"
image = "0.25"

# Utilities
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }

# Core library shared
designbot-core = { path = "designbot" }
designbot-render = { path = "designbot-render" }
